name: Diagnose Insight Apple notarization

on: workflow_dispatch

permissions:
  contents: read

jobs:
  authentication:
    name: Check Apple notarization authentication
    runs-on: macos-15
    environment: desktop-release
    timeout-minutes: 10
    steps:
      - name: Check notarytool history without logging credentials or history
        shell: bash
        env:
          APPLE_API_KEY_PEM: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          set +x
          : "${APPLE_API_KEY_PEM:?Missing Apple API key}" "${APPLE_KEY_ID:?Missing Apple key ID}" "${APPLE_ISSUER:?Missing Apple issuer}"
          umask 077
          probe=$(mktemp -d "$RUNNER_TEMP/insight-notary-auth.XXXXXX")
          trap 'rm -rf -- "$probe"' EXIT
          printf '%s' "$APPLE_API_KEY_PEM" > "$probe/key.p8"
          unset APPLE_API_KEY_PEM
          /usr/bin/xcodebuild -version
          if /usr/bin/xcrun notarytool history --key "$probe/key.p8" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER" --output-format json > "$probe/stdout" 2> "$probe/stderr"; then
            echo 'Apple notarytool history succeeded'
          else
            status=$?
            echo "Apple notarytool history failed (exit $status)"
            /usr/bin/perl -ne 'while (/HTTP(?: status(?: code)?)?[: =]+([45][0-9]{2})/ig) { print "Apple HTTP status $1\n" } while (/NSURLErrorDomain.{0,35}?Code[ =]+(-[0-9]{3,5})/ig) { print "Apple network error $1\n" } print "Apple reported a required agreement\n" if /required agreement|license agreement|legal agreement/i; print "Apple reported an authentication or permission error\n" if /unauthorized|authentication|invalid credentials|forbidden/i; print "Apple reported a connection error\n" if /timed out|connection|could not resolve|could not connect|network/i;' "$probe/stderr" "$probe/stdout"
            exit "$status"
          fi

  arm64:
    name: Package ${{ matrix.source }}
    needs: authentication
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: before-pr-8
            commit: 3da69342984d499c5bb96d114b70f15d0ffa1c69
          - source: rc-7
            commit: 7e6ddd8ea3de3e969451923d833ad187e7498b3b
    runs-on: macos-15
    environment: desktop-release
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DSH_DESKTOP_PRODUCT: insight
      INSIGHT_DESKTOP_VERSION: '1.0.13-rc.7'
      DSH_PACKAGING_PRESET: test
      INSIGHT_MACOS_TARGET: mac-arm64
      INSIGHT_SKIP_NOTARIZATION: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
          clean: true
      - name: Confirm the Insight package commit
        env:
          EXPECTED_COMMIT: ${{ matrix.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Restore Electron and Desktop runtime caches
        uses: actions/cache@v4.2.4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/dsh-insight-package
          key: insight-macos-arm64-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
      - name: Configure package caches
        run: echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$HOME/.cache/dsh-insight-package" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare private signing configuration
        id: configuration
        env:
          INSIGHT_MACOS_CONFIGURATION_ACTION: prepare
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ vars.DSH_DESKTOP_MACOS_SIGNING_IDENTITY }}
          DESKTOP_CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          DESKTOP_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          DESKTOP_APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
          DESKTOP_APPLE_API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: node --import tsx scripts/insight-release/prepare-macos.ts
      - name: Build signed Insight installers
        run: pnpm run package:desktop:mac:arm64
      - name: Classify notarization stages and errors
        if: always() && steps.configuration.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs'
          const root = 'apps/desktop/.desktop-build/packaging-runs'
          for (const { name, isDirectory } of readdirSync(root, { withFileTypes: true }).map(entry => ({ name: entry.name, isDirectory: entry.isDirectory() }))) {
            if (!isDirectory) continue
            const lines = readFileSync(root + '/' + name + '/events.jsonl', 'utf8').trim().split('\n')
            for (const line of lines) {
              const entry = JSON.parse(line)
              if (entry.type !== 'stage-end' || !entry.stage.startsWith('notarytool:')) continue
              const action = entry.stage.split(':')[1]
              const artifact = entry.stage.endsWith('.zip') ? 'zip' : entry.stage.endsWith('.dmg') ? 'dmg' : ''
              const error = entry.error ?? ''
              const http = error.match(/HTTP(?: status(?: code)?)?[: =]+([45][0-9]{2})\b/i)?.[1]
              const network = error.match(/NSURLErrorDomain.{0,35}?Code[ =]+(-[0-9]{3,5})/i)?.[1]
              console.log(JSON.stringify({ action, artifact, success: entry.success, http, network,
                agreement: /required agreement|license agreement|legal agreement/i.test(error),
                authentication: /unauthorized|authentication|invalid credentials|forbidden/i.test(error),
                transport: /timed out|connection|could not resolve|could not connect|network/i.test(error),
                storage: /s3|aws/i.test(error), presubmission: /pre-submission|invalid archive|unsupported file/i.test(error) }))
            }
          }
          JS
      - name: Remove private signing configuration
        if: always() && steps.configuration.outcome == 'success'
        env:
          INSIGHT_MACOS_CONFIGURATION_ACTION: cleanup
        run: node --import tsx scripts/insight-release/prepare-macos.ts
