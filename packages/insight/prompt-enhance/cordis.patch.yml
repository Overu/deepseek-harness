# Prompt Enhance bundle layer. The relative entry is resolved from the bundled
# package root, which lets the desktop runtime load this package's host and
# client halves without relying on the root workspace package resolver.
# The host owns the authenticated Connection routes and slash command; the
# client contributes the composer button, preview panel, and undo bar.
- insert:
    - id: prompt-enhance
      name: ./lib/index.js
