# Replay the authored skill creation through the shipped headless profile.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: dsh-memory-evolve
      name: ../../../packages/insight/memory-evolve/lib/index.js
      config:
        injectMemory: false
        memoryDir: !!js process.cwd() + '/.dsh/memory-evolve'
        skillDir: !!js process.cwd() + '/skills-output'
