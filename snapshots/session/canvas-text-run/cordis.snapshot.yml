- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- insert:
    - id: canvas-text-run-fixture
      name: '../../../packages/insight/canvas/test/fixtures/text-run-snapshot.ts'

- id: headless-runner
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: canvas-text-run-snapshot
    json: !!js ctx.headlessStartup.json
